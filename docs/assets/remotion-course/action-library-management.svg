<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" width="1440" height="880">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="lib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Noto Sans SC","Segoe UI",sans-serif;fill:#0f172a}
      .sub{font:500 17px -apple-system,BlinkMacSystemFont,"Noto Sans SC","Segoe UI",sans-serif;fill:#475569}
      .label{font:700 20px -apple-system,BlinkMacSystemFont,"Noto Sans SC","Segoe UI",sans-serif;fill:#0f172a}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Noto Sans SC","Segoe UI",sans-serif;fill:#64748b}
      .white{font:700 24px -apple-system,BlinkMacSystemFont,"Noto Sans SC","Segoe UI",sans-serif;fill:white}
      .whiteSmall{font:500 15px -apple-system,BlinkMacSystemFont,"Noto Sans SC","Segoe UI",sans-serif;fill:#ede9fe}
      .card{fill:white;stroke:#e9d5ff;stroke-width:2;rx:22}
      .panel{fill:white;stroke:#c4b5fd;stroke-width:3;rx:28}
      .line{fill:none;stroke:#a78bfa;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrowP" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="1440" height="880" fill="url(#bg4)"/>
  <text x="70" y="70" class="title">动画动作库管理模型</text>
  <text x="70" y="106" class="sub">动作库是可参数化、可预览、可版本化的教学动画模板，而不是散落在 timeline 里的临时参数。</text>

  <rect x="70" y="190" width="330" height="520" class="panel"/>
  <rect x="105" y="225" width="260" height="86" rx="24" fill="url(#lib)"/>
  <text x="135" y="260" class="white">Action Library</text>
  <text x="135" y="288" class="whiteSmall">highlight / arrow / circle / card</text>
  <rect x="105" y="345" width="260" height="58" class="card"/>
  <text x="133" y="381" class="label">浏览动作</text>
  <rect x="105" y="425" width="260" height="58" class="card"/>
  <text x="133" y="461" class="label">筛选分类</text>
  <rect x="105" y="505" width="260" height="58" class="card"/>
  <text x="133" y="541" class="label">查看状态</text>
  <rect x="105" y="585" width="260" height="58" class="card"/>
  <text x="133" y="621" class="label">插入时间轴</text>

  <rect x="520" y="160" width="350" height="250" class="panel"/>
  <text x="555" y="210" class="label">动作详情与参数</text>
  <text x="555" y="245" class="small">name / category / description</text>
  <text x="555" y="275" class="small">params schema / presets</text>
  <text x="555" y="305" class="small">duration / easing / style tokens</text>
  <text x="555" y="335" class="small">compatibility: Remotion / CapCut</text>

  <rect x="520" y="500" width="350" height="220" class="panel"/>
  <text x="555" y="550" class="label">预览与验证</text>
  <text x="555" y="585" class="small">demo slide + demo segment</text>
  <text x="555" y="615" class="small">参数改动即时预览</text>
  <text x="555" y="645" class="small">保存 draft / ready</text>
  <text x="555" y="675" class="small">检测 text overflow 与边界</text>

  <rect x="1010" y="160" width="330" height="220" class="panel"/>
  <text x="1045" y="210" class="label">版本与影响面</text>
  <text x="1045" y="245" class="small">safe edit: 文案和标签</text>
  <text x="1045" y="275" class="small">breaking edit: 参数和行为</text>
  <text x="1045" y="305" class="small">ready / draft / deprecated</text>
  <text x="1045" y="335" class="small">usage impact: 引用它的 segments</text>

  <rect x="1010" y="500" width="330" height="220" class="panel"/>
  <text x="1045" y="550" class="label">Timeline 引用</text>
  <text x="1045" y="585" class="small">actionId + presetId</text>
  <text x="1045" y="615" class="small">from + duration</text>
  <text x="1045" y="645" class="small">params override</text>
  <text x="1045" y="675" class="small">Codex 只生成 action refs</text>

  <path class="line" marker-end="url(#arrowP)" d="M400 440 C455 360 475 270 520 245"/>
  <path class="line" marker-end="url(#arrowP)" d="M400 505 C455 560 475 595 520 610"/>
  <path class="line" marker-end="url(#arrowP)" d="M870 285 C925 285 955 270 1010 260"/>
  <path class="line" marker-end="url(#arrowP)" d="M870 610 C925 610 955 610 1010 610"/>
  <path class="line" marker-end="url(#arrowP)" d="M1175 500 C1175 435 1175 415 1175 380"/>

  <rect x="108" y="760" width="1224" height="62" rx="22" fill="#1e1b4b" opacity=".94"/>
  <text x="140" y="798" class="whiteSmall">设计原则：timeline 引用动作库 id，动作库负责参数化、预览、版本和兼容性；Codex 输出 action refs，而不是自由生成不可复用动画。</text>
</svg>
