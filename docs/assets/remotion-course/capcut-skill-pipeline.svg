<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" width="1440" height="760">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Noto Sans SC","Segoe UI",sans-serif;fill:#0f172a}
      .sub{font:500 17px -apple-system,BlinkMacSystemFont,"Noto Sans SC","Segoe UI",sans-serif;fill:#475569}
      .label{font:700 20px -apple-system,BlinkMacSystemFont,"Noto Sans SC","Segoe UI",sans-serif;fill:#0f172a}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Noto Sans SC","Segoe UI",sans-serif;fill:#64748b}
      .card{fill:white;stroke:#e2e8f0;stroke-width:2;rx:22}
      .hot{fill:#fffbeb;stroke:#f59e0b;stroke-width:3;rx:24}
      .blue{fill:#eff6ff;stroke:#3b82f6;stroke-width:3;rx:24}
      .green{fill:#ecfdf5;stroke:#10b981;stroke-width:3;rx:24}
      .line{fill:none;stroke:#94a3b8;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrowC" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1440" height="760" fill="url(#bg3)"/>
  <text x="70" y="70" class="title">剪映/CapCut + Codex 自动化链路</text>
  <text x="70" y="106" class="sub">Codex 生成候选，管理台确认，Remotion 产出通用素材包，剪映/CapCut 做最后包装。</text>

  <rect x="70" y="190" width="230" height="84" class="card"/>
  <text x="105" y="224" class="label">素材目录</text>
  <text x="105" y="252" class="small">speaker / slides / script</text>
  <rect x="70" y="325" width="230" height="84" class="card"/>
  <text x="105" y="359" class="label">讲稿或 captions</text>
  <text x="105" y="387" class="small">句子 / 关键词 / 章节</text>
  <rect x="70" y="460" width="230" height="84" class="card"/>
  <text x="105" y="494" class="label">课程风格与重点</text>
  <text x="105" y="522" class="small">B站 / 录播课 / 训练营</text>

  <rect x="410" y="305" width="260" height="130" class="hot"/>
  <text x="452" y="356" class="label">Codex 自动化工具</text>
  <text x="452" y="388" class="small">生成 timeline 与动作建议</text>

  <rect x="770" y="170" width="250" height="82" class="blue"/>
  <text x="805" y="205" class="label">Timeline JSON/TS</text>
  <text x="805" y="232" class="small">segments + action refs</text>
  <rect x="770" y="300" width="250" height="82" class="blue"/>
  <text x="805" y="335" class="label">Annotations 建议</text>
  <text x="805" y="362" class="small">引用动作库 actionId</text>
  <rect x="770" y="430" width="250" height="82" class="blue"/>
  <text x="805" y="465" class="label">素材缺失报告</text>
  <text x="805" y="492" class="small">missing slides / invalid time</text>

  <rect x="1110" y="275" width="250" height="130" class="green"/>
  <text x="1145" y="326" class="label">管理台人工确认</text>
  <text x="1145" y="358" class="small">预览、微调、保存版本</text>

  <rect x="1110" y="500" width="250" height="82" class="card"/>
  <text x="1145" y="535" class="label">剪映交付包</text>
  <text x="1145" y="562" class="small">MP4 / overlay / SRT / guide</text>

  <path class="line" marker-end="url(#arrowC)" d="M300 232 C345 232 360 335 410 345"/>
  <path class="line" marker-end="url(#arrowC)" d="M300 367 L410 367"/>
  <path class="line" marker-end="url(#arrowC)" d="M300 502 C350 502 360 395 410 390"/>
  <path class="line" marker-end="url(#arrowC)" d="M670 350 C720 300 735 210 770 210"/>
  <path class="line" marker-end="url(#arrowC)" d="M670 370 L770 341"/>
  <path class="line" marker-end="url(#arrowC)" d="M670 390 C720 430 735 470 770 470"/>
  <path class="line" marker-end="url(#arrowC)" d="M1020 210 C1070 225 1080 295 1110 315"/>
  <path class="line" marker-end="url(#arrowC)" d="M1020 341 L1110 340"/>
  <path class="line" marker-end="url(#arrowC)" d="M1235 405 L1235 500"/>
  <text x="930" y="660" class="sub">剪辑软件负责包装与二创；项目负责生成结构化素材包。</text>
</svg>
