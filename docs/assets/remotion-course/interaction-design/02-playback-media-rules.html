<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#eef3f8;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif}.frame{width:1600px;height:1000px;background:linear-gradient(135deg,#f8fbff,#edf5f2);position:relative;overflow:hidden}.header{position:absolute;left:70px;top:54px}.eyebrow{font-size:18px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;fill:#5f728a}.h1{font-size:46px;font-weight:900;fill:#102033}.sub{font-size:22px;font-weight:700;fill:#64748b}.title{font-size:26px;font-weight:900;fill:#102033}.body{font-size:18px;font-weight:750;fill:#64748b}.small{font-size:16px;font-weight:800;fill:#64748b}.chip{font-size:15px;font-weight:850;fill:white}.arrow{stroke:#5f728a;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#14b8a6;stroke-width:5;fill:none;stroke-dasharray:12 12;marker-end:url(#tealArrow)}.accent{filter:drop-shadow(0 18px 28px rgba(37,99,235,.16))}</style></head><body><div class="frame"><svg width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10" fill="#5f728a"/></marker><marker id="tealArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10" fill="#14b8a6"/></marker></defs><text x="70" y="82" class="eyebrow">REMOTION COURSE WORKBENCH</text><text x="70" y="136" class="h1">后台区 / 前台区播放规则</text><text x="72" y="178" class="sub">后台只管画面，前台负责口播音频；总时长由后台区决定</text><rect x="74" y="238" width="1450" height="620" rx="32" fill="white" stroke="#cfe0f5" stroke-width="3"/><rect x="120" y="310" width="250" height="130" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="142" y="348" class="title">上传后台区</text><text x="142" y="382" class="body">主画面，默认静音</text><rect x="120" y="560" width="250" height="130" rx="18" fill="#ecfdf5" stroke="#7dd3c7" stroke-width="2"/><text x="142" y="598" class="title">上传前台区</text><t
