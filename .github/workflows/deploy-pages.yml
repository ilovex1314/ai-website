name: Deploy ai-website to Cloudflare Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-pages-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate, test, build, and deploy
    runs-on: ubuntu-latest
    environment:
      name: CLOUDFLARE_API_TOKEN
      url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          deployment_log="$RUNNER_TEMP/wrangler-pages-deploy.log"
          npx --yes wrangler@3.90.0 pages deploy dist --project-name=ai-website --branch=main 2>&1 | tee "$deployment_log"
          deployment_url=$(sed -nE 's|.*(https://[^[:space:]]+\.pages\.dev).*|\1|p' "$deployment_log" | tail -n 1)
          if [[ -z "$deployment_url" ]]; then
            echo "::error::Cloudflare deployment completed without a detectable Pages URL"
            exit 1
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
