    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minimal HyperFrames Course</title>
    <style>
      body { margin: 0; background: #10213d; color: #f8fafc; font-family: Arial, sans-serif; }
      [data-hf-scene-id] { min-height: 100vh; display: grid; place-items: center; padding: 48px; box-sizing: border-box; }

      @media (min-aspect-ratio: 1 / 1) and (max-aspect-ratio: 4 / 3) { [data-hf-scene-id] { padding: 40px; } }
    </style>
  </head>

    <section data-hf-scene-id="scene-intro">
      <h1 data-hf-element-id="intro-title" data-hf-role="title" data-hf-editable="true">Build better courses</h1>

</body></html>
